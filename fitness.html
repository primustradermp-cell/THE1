<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymSync" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>GymSync · Personal Training &amp; Workout Tracker</title>
  <meta name="description" content="Minimalist weekly workout routine planner, per-set exercise logger, and gym calendar." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css?v=24" />
  <link rel="stylesheet" href="styles.css?v=24" />
  <script src="theme.js?v=24"></script>
</head>
<body class="fitness-page">
  <div class="viewport-frame">
    <!-- LEFT MAIN WORKSPACE -->
    <div class="left-column fitness-left">
      <!-- Subtle Translucent Gym Backdrop -->
      <img class="fitness-page-bg" src="./fitness-bg.jpg" alt="" aria-hidden="true" />
      <div class="fitness-page-overlay" aria-hidden="true"></div>

      <!-- Unified Single-Row Top Bar -->
      <header class="hud-topbar">
        <div class="hud-left">
          <div class="status-cluster">
            <span class="pill-dot"></span>
            <span>Fitness</span>
            <span class="cluster-sep" aria-hidden="true">·</span>
            <span class="mono cluster-clock" id="gym-widget-month">0 days this month</span>
          </div>
        </div>

        <nav class="hud-nav" aria-label="Site navigation">
          <a class="hud-tab hud-page-link" href="index.html?v=24">Prayer</a>
          <a class="hud-tab hud-page-link is-active" href="fitness.html?v=24" aria-current="page">Fitness</a>
        </nav>

        <div class="hud-right">
          <div class="theme-switch" role="group" aria-label="Theme switcher">
            <button type="button" class="theme-opt is-active" data-set-theme="dark" aria-pressed="true">
              <svg class="icon icon-xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span>Dark</span>
            </button>
            <button type="button" class="theme-opt" data-set-theme="light" aria-pressed="false">
              <svg class="icon icon-xs" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
              <span>Light</span>
            </button>
          </div>
        </div>
      </header>

      <!-- MAIN WORKOUT FOCAL CARD -->
      <section class="panel-dark workout-stage-card" aria-label="Today's workout">
        <!-- 1. Clear Mon–Sun Weekly Selector -->
        <div class="weekday-bar workout-week-bar" id="weekday-bar" role="tablist" aria-label="Weekly routine days">
          <!-- Populated by fitness.js -->
        </div>

        <!-- 2. Prominent Workout Title, Category & Day Controls -->
        <div class="workout-hero-header">
          <div class="workout-hero-left">
            <div class="workout-date-row">
              <div class="day-nav-inline">
                <button class="sq-btn sq-btn-sm" id="btn-prev-day" type="button" aria-label="Previous day">
                  <svg class="icon icon-xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button class="hud-btn hud-btn-sm" id="btn-today" type="button">Today</button>
                <button class="sq-btn sq-btn-sm" id="btn-next-day" type="button" aria-label="Next day">
                  <svg class="icon icon-xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
              <span class="workout-date-label mono" id="selected-date-title">Today</span>
            </div>

            <div class="workout-title-row">
              <h1 class="workout-display-title ds-h1" id="workout-display-title">Workout</h1>
              <span class="workout-cat-pill badge badge-accent" id="workout-cat-pill">TRAINING</span>
              <button type="button" class="edit-split-trigger" id="btn-toggle-split-editor" aria-expanded="false">
                Edit split
              </button>
            </div>
          </div>

          <button class="gym-check-btn" id="btn-toggle-gym" type="button" aria-pressed="false">
            <span class="gym-check-circle" aria-hidden="true">✓</span>
            <span id="btn-toggle-gym-text">Mark Gym Day</span>
          </button>
        </div>

        <!-- Collapsible Split Editor (keeps main screen uncluttered) -->
        <div class="split-editor-drawer" id="split-editor-drawer" hidden>
          <div class="split-editor-inner">
            <label class="workout-field">
              <span class="m-lbl" id="split-day-label">Workout Name</span>
              <input
                type="text"
                id="workout-title-input"
                class="dark-input"
                placeholder="e.g. Push, Pull, Legs & Abs, Rest…"
                autocomplete="off"
              />
            </label>
            <div class="split-presets" aria-label="Quick training categories">
              <button type="button" class="preset-chip" data-split="Push">Push</button>
              <button type="button" class="preset-chip" data-split="Pull">Pull</button>
              <button type="button" class="preset-chip" data-split="Legs">Legs</button>
              <button type="button" class="preset-chip" data-split="Upper">Upper</button>
              <button type="button" class="preset-chip" data-split="Lower">Lower</button>
              <button type="button" class="preset-chip" data-split="Full Body">Full Body</button>
              <button type="button" class="preset-chip" data-split="Rest">Rest</button>
            </div>
          </div>
        </div>

        <!-- 3. Clean Exercise List with Individual Per-Set Editing -->
        <div class="exercise-list-wrap workout-list-wrap">
          <div class="exercise-list-head-simple mono" id="exercise-list-head">
            <span id="list-day-heading">Exercises</span>
            <span>Sets · Reps · Weight</span>
          </div>
          <div class="exercise-list" id="exercise-list">
            <!-- Populated by fitness.js -->
          </div>
        </div>

        <!-- 4. Simple Inline Exercise Adder -->
        <form class="quick-add-row" id="add-preset-form">
          <input
            type="text"
            id="input-preset-exercise"
            class="dark-input"
            placeholder="+ Add exercise to today’s routine…"
            autocomplete="off"
            required
          />
          <button type="submit" class="hud-btn hud-btn-accent add-preset-btn">+ Add Exercise</button>
        </form>

        <!-- 5. Compact Session Notes -->
        <div class="workout-notes-bar compact-notes">
          <input
            type="text"
            id="workout-notes-input"
            class="dark-input notes-single-input"
            placeholder="Add session note (PRs, energy, cardio)…"
            autocomplete="off"
          />
        </div>
      </section>

      <!-- COMPACT UNIFIED TRAINING SUMMARY STRIP (Matches Prayer Daily Progress) -->
      <section class="panel-dark fitness-summary-strip" aria-label="Weekly training progress">
        <div class="fs-left">
          <div class="fs-head">
            <span class="dp-label">Weekly Progress</span>
            <span class="mono fs-week-count" id="stat-week-days">0 / 7 days</span>
          </div>
          <div class="fs-week-pills" id="week-progress-pills">
            <!-- Populated by fitness.js -->
          </div>
        </div>

        <div class="dp-divider" aria-hidden="true"></div>

        <div class="dp-metrics">
          <div class="dp-metric">
            <span class="m-lbl">Sets Done</span>
            <span class="dp-metric-val mono" id="stat-day-sets">0 / 0</span>
          </div>
          <div class="dp-metric">
            <span class="m-lbl">Est. Reps</span>
            <span class="dp-metric-val mono" id="stat-day-reps">0</span>
          </div>
          <div class="dp-metric">
            <span class="m-lbl">All-Time</span>
            <span class="dp-metric-val mono" id="stat-all-days">0 d</span>
          </div>
        </div>
      </section>
    </div>

    <!-- QUIETER RIGHT SIDEBAR (Calendar & Recent Sessions) -->
    <aside class="inspector-sidebar fitness-sidebar" aria-label="Gym Calendar and Recent Sessions">
      <div class="inspector-body">
        <div class="sidebar-block">
          <div class="gym-cal-head">
            <span class="insp-label">Calendar</span>
            <div class="cal-nav-group">
              <button type="button" class="cal-nav-btn" id="cal-prev" aria-label="Previous month">
                <svg class="icon icon-xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <span class="mono gym-cal-month" id="cal-month-label">Month Year</span>
              <button type="button" class="cal-nav-btn" id="cal-next" aria-label="Next month">
                <svg class="icon icon-xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </div>

          <div class="gym-cal-weekdays mono">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
          <div class="gym-cal-grid" id="gym-cal-grid"></div>
        </div>

        <hr class="divider" />

        <div class="sidebar-block">
          <div class="insp-label">Recent Sessions</div>
          <div class="recent-list" id="recent-list"></div>
        </div>

        <hr class="divider" />

        <div class="insp-bottom-actions">
          <button type="button" class="insp-ghost-btn" id="btn-export-fitness">
            <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Export Workout CSV</span>
          </button>
        </div>
      </div>

      <button class="inspector-cta" id="btn-jump-today-cta" type="button">
        Jump to Today’s Workout
      </button>
    </aside>
  </div>

  <script src="fitness.js?v=24"></script>
</body>
</html>
